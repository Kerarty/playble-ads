name: Deploy simulator to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a second push queues behind the first.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the playable, checks each artefact against every network's spec,
      # then builds the simulator around it. A Pages deploy is not the place to
      # discover the unit no longer fits Meta's size cap.
      - name: Build simulator with playable artefacts
        run: npm run build --workspace=apps/simulator

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/simulator/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
