<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover plus user-scalable=no: a playable is a fixed-size game
      surface, and a pinch-zoom or double-tap zoom would break drag input.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Playble Demo</title>
  </head>
  <body>
    <div id="playble-root"></div>
    <script type="module" src="/src/entry-web.ts"></script>
  </body>
</html>
